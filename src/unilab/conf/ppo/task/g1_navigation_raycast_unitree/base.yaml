# @package _global_
# G1 navigation (raycast obstacle avoidance, official unitree ONNX low-level)
# Manager-Based task declaration. Ported from InstinctMJ
# Instinct-G1-RayCaster-Obstacle-Avoidance-Unitree-v0 (Stage 1).
#
# Time base: the env runs at 50 Hz (sim_dt 0.005, ctrl_dt 0.02, 4 substeps)
# because UniLab applies one control per env step; the navigation action term
# consumes the 10 Hz high-level residual only every 5 steps.
env:
  scene:
    default_keyframe_name: stand
    primary_entity: robot
    entity_assets:
      - name: floor
        source:
          model_file: src/unilab/assets/robots/g1/navigation_unitree/floor_entity.xml
        kind: rigid
        root_mode: fixed
      - name: robot
        source:
          model_file: src/unilab/assets/robots/g1/navigation_unitree/g1.xml
        root_mode: floating
        initial_state:
          position: [0.0, 0.0, 0.8]
          quaternion: [1.0, 0.0, 0.0, 0.0]
      - name: obstacle_0
        source:
          model_file: src/unilab/assets/robots/g1/navigation_unitree/obstacle_box_entity_0.xml
        root_mode: kinematic
      - name: obstacle_1
        source:
          model_file: src/unilab/assets/robots/g1/navigation_unitree/obstacle_box_entity_1.xml
        root_mode: kinematic
      - name: obstacle_2
        source:
          model_file: src/unilab/assets/robots/g1/navigation_unitree/obstacle_box_entity_2.xml
        root_mode: kinematic
    fragment_files:
      - src/unilab/assets/robots/g1/navigation_unitree/navigation_sensors.xml
    entities:
      floor:
        physical_entity: floor
        root_body_name: floor/floor
        body_names: [floor/floor]
      robot:
        root_body_name: robot/pelvis
        physical_entity: robot
        joint_names:
          - robot/left_hip_pitch_joint
          - robot/left_hip_roll_joint
          - robot/left_hip_yaw_joint
          - robot/left_knee_joint
          - robot/left_ankle_pitch_joint
          - robot/left_ankle_roll_joint
          - robot/right_hip_pitch_joint
          - robot/right_hip_roll_joint
          - robot/right_hip_yaw_joint
          - robot/right_knee_joint
          - robot/right_ankle_pitch_joint
          - robot/right_ankle_roll_joint
          - robot/waist_yaw_joint
          - robot/waist_roll_joint
          - robot/waist_pitch_joint
          - robot/left_shoulder_pitch_joint
          - robot/left_shoulder_roll_joint
          - robot/left_shoulder_yaw_joint
          - robot/left_elbow_joint
          - robot/left_wrist_roll_joint
          - robot/left_wrist_pitch_joint
          - robot/left_wrist_yaw_joint
          - robot/right_shoulder_pitch_joint
          - robot/right_shoulder_roll_joint
          - robot/right_shoulder_yaw_joint
          - robot/right_elbow_joint
          - robot/right_wrist_roll_joint
          - robot/right_wrist_pitch_joint
          - robot/right_wrist_yaw_joint
        actuator_names:
          - robot/left_hip_pitch_joint
          - robot/left_hip_roll_joint
          - robot/left_hip_yaw_joint
          - robot/left_knee_joint
          - robot/left_ankle_pitch_joint
          - robot/left_ankle_roll_joint
          - robot/right_hip_pitch_joint
          - robot/right_hip_roll_joint
          - robot/right_hip_yaw_joint
          - robot/right_knee_joint
          - robot/right_ankle_pitch_joint
          - robot/right_ankle_roll_joint
          - robot/waist_yaw_joint
          - robot/waist_roll_joint
          - robot/waist_pitch_joint
          - robot/left_shoulder_pitch_joint
          - robot/left_shoulder_roll_joint
          - robot/left_shoulder_yaw_joint
          - robot/left_elbow_joint
          - robot/left_wrist_roll_joint
          - robot/left_wrist_pitch_joint
          - robot/left_wrist_yaw_joint
          - robot/right_shoulder_pitch_joint
          - robot/right_shoulder_roll_joint
          - robot/right_shoulder_yaw_joint
          - robot/right_elbow_joint
          - robot/right_wrist_roll_joint
          - robot/right_wrist_pitch_joint
          - robot/right_wrist_yaw_joint
        body_names:
          - robot/pelvis
          - robot/left_hip_pitch_link
          - robot/left_hip_roll_link
          - robot/left_hip_yaw_link
          - robot/left_knee_link
          - robot/left_ankle_pitch_link
          - robot/left_ankle_roll_link
          - robot/right_hip_pitch_link
          - robot/right_hip_roll_link
          - robot/right_hip_yaw_link
          - robot/right_knee_link
          - robot/right_ankle_pitch_link
          - robot/right_ankle_roll_link
          - robot/waist_yaw_link
          - robot/waist_roll_link
          - robot/torso_link
          - robot/left_shoulder_pitch_link
          - robot/left_shoulder_roll_link
          - robot/left_shoulder_yaw_link
          - robot/left_elbow_link
          - robot/left_wrist_roll_link
          - robot/left_wrist_pitch_link
          - robot/left_wrist_yaw_link
          - robot/right_shoulder_pitch_link
          - robot/right_shoulder_roll_link
          - robot/right_shoulder_yaw_link
          - robot/right_elbow_link
          - robot/right_wrist_roll_link
          - robot/right_wrist_pitch_link
          - robot/right_wrist_yaw_link
      obstacle_0:
        physical_entity: obstacle_0
        root_body_name: obstacle_0/obstacle_box_0
        body_names: [obstacle_0/obstacle_box_0]
      obstacle_1:
        physical_entity: obstacle_1
        root_body_name: obstacle_1/obstacle_box_1
        body_names: [obstacle_1/obstacle_box_1]
      obstacle_2:
        physical_entity: obstacle_2
        root_body_name: obstacle_2/obstacle_box_2
        body_names: [obstacle_2/obstacle_box_2]
  sim_dt: 0.005
  ctrl_dt: 0.02
  # sim_substeps derives to 4; UniLab applies one control per 0.02 s step and
  # the navigation action term consumes the 10 Hz high-level action every 5
  # steps.
  max_episode_seconds: 20.0
  observations:
    policy:
      enable_corruption: false
      terms:
        goal:
          func: unilab.tasks.navigation.mdp.goal
        base_ang_vel:
          func: unilab.tasks.navigation.mdp.base_ang_vel_body
        projected_gravity:
          func: unilab.tasks.navigation.mdp.projected_gravity_body
        previous_action:
          func: unilab.envs.mdp.last_action
          params: {action_name: navigation}
        forward_scan:
          func: unilab.tasks.navigation.ray_observation.NormalizedRayScan
          params:
            ray_pattern:
              _target_: unilab.envs.mdp.ray_observation.RayPatternCfg
              entity_name: robot
              max_distance: 3.0
              attachment_body_name: robot/torso_link
              alignment: yaw
              caster: uni_ray
              allowed_geom_names:
                - floor/floor
                - obstacle_0/obstacle_box_0_collision
                - obstacle_1/obstacle_box_1_collision
                - obstacle_2/obstacle_box_2_collision
              pattern:
                _target_: unilab.envs.mdp.ray_observation.RayCameraPatternCfg
                width: 32
                height: 16
                fovy: 45.0
                forward: [0.9659258262890683, 0.0, -0.25881904510252074]
                up: [0.25881904510252074, 0.0, 0.9659258262890683]
    critic:
      terms:
        goal:
          func: unilab.tasks.navigation.mdp.goal
        base_ang_vel:
          func: unilab.tasks.navigation.mdp.base_ang_vel_body
        projected_gravity:
          func: unilab.tasks.navigation.mdp.projected_gravity_body
        previous_action:
          func: unilab.envs.mdp.last_action
          params: {action_name: navigation}
        forward_scan:
          func: unilab.tasks.navigation.ray_observation.NormalizedRayScan
          params:
            ray_pattern:
              _target_: unilab.envs.mdp.ray_observation.RayPatternCfg
              entity_name: robot
              max_distance: 3.0
              attachment_body_name: robot/torso_link
              alignment: yaw
              caster: uni_ray
              allowed_geom_names:
                - floor/floor
                - obstacle_0/obstacle_box_0_collision
                - obstacle_1/obstacle_box_1_collision
                - obstacle_2/obstacle_box_2_collision
              pattern:
                _target_: unilab.envs.mdp.ray_observation.RayCameraPatternCfg
                width: 32
                height: 16
                fovy: 45.0
                forward: [0.9659258262890683, 0.0, -0.25881904510252074]
                up: [0.25881904510252074, 0.0, 0.9659258262890683]
  actions:
    navigation:
      _target_: unilab.tasks.navigation.manager_terms.NavigationActionCfg
      entity_name: robot
      stage: 1
      checkpoint: ""
      backend: unitree_onnx
      teleop: false
      log_goal: false
      show_rays: false
      high_level_every: 5
  commands: {}
  events:
    reset_robot_to_stand:
      func: unilab.tasks.navigation.mdp.reset_robot_to_stand
      mode: reset
  terminations:
    success:
      func: unilab.tasks.navigation.mdp.navigation_outcome
      params: {kind: success}
    collision:
      func: unilab.tasks.navigation.mdp.navigation_outcome
      params: {kind: collision}
    fall:
      func: unilab.tasks.navigation.mdp.navigation_outcome
      params: {kind: fall}
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  progress:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: 2.0
    params: {kind: progress}
  success:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: 10.0
    params: {kind: success}
  collision:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: -10.0
    params: {kind: collision}
  fall:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: -10.0
    params: {kind: fall}
  time:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: -0.1
    params: {kind: time}
  smoothness:
    func: unilab.tasks.navigation.mdp.navigation_reward
    weight: -0.05
    params: {kind: smoothness}