# @package _global_
# MuJoCo owner for the G1 navigation raycast task. Train with the 50 Hz action
# contract below; 10 Hz or action-skipping checkpoints require retraining.
defaults:
  - /task/g1_navigation_raycast_unitree/base
  - _self_

training:
  task_name: G1NavigationRayCastUnitree
  sim_backend: mujoco
algo:
  num_envs: 1
  # Preserve the original 2.4 s rollout and physical discount/GAE decay:
  # 24 * 0.1 s = 120 * 0.02 s; gamma/lam are fifth roots of 0.99/0.95.
  # This preserves time scales, not PPO learning or checkpoint equivalence.
  num_steps_per_env: 120
  algorithm:
    gamma: 0.9979919516614258
    lam: 0.9897937816869885
  # MLP 524 -> 256 -> 128 -> 128 -> 3 with observation normalization.
  actor:
    hidden_dims: [256, 128, 128]
    activation: elu
    obs_normalization: true
  obs_groups:
    actor:
      - policy
play_profile:
  enabled: true
  env:
    render_spacing: 12.0
