# @package _global_
# MuJoCo owner for the G1 navigation raycast task. Train with the 0.1 s env
# step contract below (InstinctMJ parity); 0.02 s action-skipping checkpoints
# require retraining.
defaults:
  - /task/g1_navigation_raycast_unitree/base
  - _self_

training:
  task_name: G1NavigationRayCastUnitree
  sim_backend: mujoco
algo:
  num_envs: 1
  # InstinctMJ parity: 24 decisions of 0.1 s = 2.4 s per rollout, with the
  # original physical discount/GAE decay.
  num_steps_per_env: 24
  algorithm:
    gamma: 0.99
    lam: 0.95
  # MLP 524 -> 256 -> 128 -> 128 -> 3 with observation normalization.
  actor:
    hidden_dims: [256, 128, 128]
    activation: elu
    obs_normalization: true
  obs_groups:
    actor:
      - policy
play_profile:
  enabled: true
  env:
    render_spacing: 12.0